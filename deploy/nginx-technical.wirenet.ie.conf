# /etc/nginx/sites-available/technical.wirenet.ie
# TLS certificate: sudo certbot --nginx -d technical.wirenet.ie

server {
    listen 80;
    listen [::]:80;
    server_name technical.wirenet.ie;
    return 301 https://technical.wirenet.ie$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name technical.wirenet.ie;

    ssl_certificate     /etc/letsencrypt/live/technical.wirenet.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/technical.wirenet.ie/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 100k;

    # Optional extra layer: only allow office / VPN ranges to reach the site at all.
    # allow 203.0.113.0/24;   # office public IP
    # allow 10.8.0.0/24;      # VPN
    # deny  all;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
